apiVersion: rabbitmq.rabbitmq.crossplane.io/v1alpha1
kind: TopicPermissions
metadata:
  annotations:
    meta.upbound.io/example-id: rabbitmq/v1alpha1/topicpermissions
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    permissions:
    - exchangeSelector:
        matchLabels:
          testing.upbound.io/example-name: example
      read: .*
      write: .*
    vhostSelector:
      matchLabels:
        testing.upbound.io/example-name: test

---

apiVersion: rabbitmq.rabbitmq.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: rabbitmq/v1alpha1/topicpermissions
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    tags:
    - administrator

---

apiVersion: rabbitmq.rabbitmq.crossplane.io/v1alpha1
kind: Vhost
metadata:
  annotations:
    meta.upbound.io/example-id: rabbitmq/v1alpha1/topicpermissions
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider: {}
